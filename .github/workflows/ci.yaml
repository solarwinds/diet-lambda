on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo check
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  build:
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    container: amazonlinux:2023

    steps:
      - run: dnf update -y && dnf install -y git gcc pkg-config openssl-devel

      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release
      - run: mkdir -p target/lambda/opt/extensions
      - run: cp target/release/diet-lambda target/lambda/opt/extensions/diet-lambda

      - uses: actions/upload-artifact@v5
        with:
          name: diet-lambda-${{ matrix.arch }}
          path: target/lambda
